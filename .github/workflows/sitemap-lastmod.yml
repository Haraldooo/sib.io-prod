name: Sitemap lastmod aktualisieren

# Setzt das <lastmod>-Datum in sitemap.xml automatisch auf das Datum der
# letzten Aenderung an index.html und committet die Sitemap zurueck nach main.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap-lastmod
  cancel-in-progress: false

jobs:
  update-lastmod:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          # Volle Historie, damit `git log` das echte Aenderungsdatum kennt
          fetch-depth: 0

      - name: lastmod aktualisieren
        run: python3 .github/scripts/update-sitemap-lastmod.py

      - name: Sitemap committen
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Keine Aenderung an sitemap.xml - nichts zu committen."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: lastmod in sitemap.xml aktualisiert [skip ci]"
          git push
